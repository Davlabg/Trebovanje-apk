name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Trebovanje.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Trebovanje-apk
          path: Trebovanje.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Trebovanje.apk \
            --target "${{ github.sha }}" \
            --title "Trebovanje (build ${{ github.run_number }})" \
            --notes "APK za instalaciju na Android telefonu." \
            --latest
